nfsPVC:
  enabled: true
  nfs:
    serverIP: 10.185.238.42

jupyterhub:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

  scheduling:
    userScheduler:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2024-05-08
  proxy:
    chp:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2024-05-08
    traefik:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2024-05-08
  hub:
    nodeSelector:
      hub.jupyter.org/pool-name: core-pool-2024-05-08
    config:
    loadRoles:
      # datahub staff
      datahub-staff:
        description: Enable admin for datahub staff
        # this role provides permissions to...
        scopes:
          - admin-ui
          - admin:groups
          - admin:users
          - admin:servers
          - read:roles
          - read:hub
          - access:servers
        # this role will be assigned to...
        groups:
          - course::1524699::group::all-admins
  singleuser:
    image:
      name: us-central1-docker.pkg.dev/ucb-datahub-2018/user-images/julia-user-image
      tag: 9026e8cd6b3d
    extraFiles:
      # DH-305
      remove-exporters:
        mountPath: /etc/jupyter/jupyter_notebook_config.py
        stringData: |
          c.QtPDFExporter.enabled = False
          c.QtPNGExporter.enabled = False
          # Causes 100% cpu spike and hang if DISPLAY is set - see DH-330
          c.WebPDFExporter.embed_images = True
          c.WebPDFExporter.enabled = False
    extraEnv:
      # Tell code where to display GUIs
      # The VNC /desktop link must be opened already for this to work
      DISPLAY: ":1.0"
      # Unset NotebookApp from hub/values. Necessary for recent lab versions.
      JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
    extraNodeAffinity:
      required:
        - matchExpressions:
            - key: hub.jupyter.org/pool-name
              operator: In
              values:
                - small-courses-pool
                - small-courses-n2-pool
                - data101-pool
                - datahub-pool
                - data101-n2-pool
                - datahub-n2-pool
      preferred:
        - weight: 100
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - small-courses-pool
        - weight: 90
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - small-courses-n2-pool
        - weight: 75
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - data101-pool
        - weight: 65
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - data101-n2-pool
        - weight: 50
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - datahub-pool
        - weight: 40
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - datahub-n2-pool
    storage:
      type: static
      static:
        pvcName: home-nfs-v3
        subPath: "{username}"
    memory:
      # https://github.com/berkeley-dsep-infra/datahub/issues/2803
      # Needed for Julia
      guarantee: 2G
      limit: 2G

