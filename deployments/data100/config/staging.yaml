nfsPVC:
  nfs:
    shareName: shares/data100/staging

jupyterhub:
  singleuser:
    extraNodeAffinity:
      required:
        - matchExpressions:
            - key: hub.jupyter.org/pool-name
              operator: In
              values:
                - user-testing-pool
                - user-testing-n2-pool
      preferred:
        - weight: 100
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - user-testing-pool
        - weight: 90
          preference:
            matchExpressions:
              - key: hub.jupyter.org/pool-name
                operator: In
                values:
                  - user-testing-n2-pool
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - data100-staging.datahub.berkeley.edu
    tls:
      - secretName: tls-cert
        hosts:
          - data100-staging.datahub.berkeley.edu
