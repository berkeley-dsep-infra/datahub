name: Transfer Deferred Data Retrieval Issues

on:
  schedule:
    - cron: "0 16 * * *"  # daily
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    env:
      DEFER_DAYS: 3

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},datahub-data-retrieval

      - name: Transfer issues pending transfer
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - Number(process.env.DEFER_DAYS) * 24 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: "pending transfer", state: "open", per_page: 100
            });
            const { repository } = await github.graphql(
              `query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }`,
              { owner, name: "datahub-data-retrieval" }
            );

            for (const issue of issues) {
              if (issue.pull_request || new Date(issue.created_at).getTime() > cutoff) {
                continue;
              }
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "pending transfer" });
              const result = await github.graphql(
                `mutation($issueId: ID!, $repositoryId: ID!) {
                  transferIssue(input: {issueId: $issueId, repositoryId: $repositoryId}) { issue { number } }
                }`,
                { issueId: issue.node_id, repositoryId: repository.id }
              );
              console.log(`Transferred #${issue.number} to datahub-data-retrieval#${result.transferIssue.issue.number}`);
            }
